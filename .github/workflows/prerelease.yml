name: Prerelease

on:
  push:
    tags:
      - v*-*
  workflow_dispatch:

concurrency:
  group: prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-tag:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit reachable from origin/main."
            exit 1
          fi

  prerelease:
    needs: verify-tag
    if: ${{ needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      artifact_name: squid4win-prerelease
      release_channel: prerelease
      prerelease: true
      publish_github_release: ${{ github.event_name == 'push' }}
    secrets:
      SQUID4WIN_SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.SQUID4WIN_SIGNING_CERTIFICATE_PFX_BASE64 }}
      SQUID4WIN_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SQUID4WIN_SIGNING_CERTIFICATE_PASSWORD }}
